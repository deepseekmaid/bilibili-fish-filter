name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # pretest 会先由 content.js 生成油猴脚本
      - run: npm test
      - run: npm run build
      # 扩展、package、油猴脚本三处版本必须一致
      - run: npm run version:check
      - uses: actions/upload-artifact@v4
        with:
          name: bilibili-fish-filter
          path: |
            dist/*.zip
            dist/*.user.js
          if-no-files-found: error
